name: Cloudflare build PR comments

# Posts a NEW pull-request comment on every Cloudflare Workers Builds event:
#   • build started
#   • build succeeded  (includes the commit's preview URL)
#   • build failed / cancelled / timed out
#   • build skipped
#
# Every comment links to the Cloudflare build page for that exact commit.
# All data comes from the check_run event payload that Cloudflare emits, no
# Cloudflare API token or secret is required (GITHUB_TOKEN is enough).
#
# NOTE: check_run-triggered workflows always run from the DEFAULT branch's copy
# of this file, so this only takes effect once it is merged to `main`. It cannot
# post comments for the very PR that introduces it.

on:
  check_run:
    types: [created, completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    # Only react to the Cloudflare Workers Builds check (named "Workers Builds: <script>").
    if: startsWith(github.event.check_run.name, 'Workers Builds')
    runs-on: ubuntu-latest
    steps:
      - name: Post build-status comment
        uses: actions/github-script@v8
        with:
          script: |
            const cr = context.payload.check_run;
            const action = context.payload.action; // 'created' | 'completed'
            const sha = cr.head_sha;
            const shortSha = sha.slice(0, 7);
            const { owner, repo } = context.repo;
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${sha}`;
            const commitLink = `[\`${shortSha}\`](${commitUrl})`;

            // A markdown link target ends at the first unescaped ')', and every
            // URL below is copied out of the check run rather than built by us,
            // so percent-encode the characters that could close the link early.
            const safeUrl = (url) => String(url).replace(/[()<>\s]/g, encodeURIComponent);
            const isHttp = (url) => /^https?:\/\//i.test(url || '');

            // Fall back to the check run's own page if Cloudflare ever sends a
            // details_url we would not want to render as a link.
            const rawBuildUrl = cr.details_url || cr.html_url;
            const buildUrl = safeUrl(isHttp(rawBuildUrl) ? rawBuildUrl : cr.html_url);

            // A build that is created already-completed (e.g. an instantly skipped
            // build) also fires a 'completed' event, let that one handle it so we
            // never emit a phantom "started" comment.
            if (action === 'created' && cr.status === 'completed') {
              core.info('Check run created already-completed; deferring to the completed event.');
              return;
            }

            // Resolve the PRs for this commit from both the payload and the commit
            // lookup, then keep only the open ones. The payload's `pull_requests`
            // entries carry no state, so without this check a merged PR keeps
            // collecting comments for every build of a commit it still contains.
            const candidates = new Set((cr.pull_requests || []).map((p) => p.number));
            try {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              for (const p of data) candidates.add(p.number);
            } catch (e) {
              core.warning(`Could not list PRs for ${shortSha}: ${e.message}`);
            }

            const prNumbers = [];
            for (const number of candidates) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (pr.state === 'open') prNumbers.push(number);
              } catch (e) {
                core.warning(`Could not read PR #${number}: ${e.message}`);
              }
            }
            if (prNumbers.length === 0) {
              core.info('No open PR associated with this commit; nothing to comment.');
              return;
            }

            // Pull the preview URLs out of the check-run output. Cloudflare has
            // shipped more than one spelling for these labels and wraps them in
            // markdown, so match the label loosely and take the first URL that
            // follows it on the same line rather than assuming ": <url>".
            const LABELS = {
              alias: ['Preview Alias URL', 'Branch Preview URL', 'Alias URL'],
              preview: ['Commit Preview URL', 'Version Preview URL', 'Preview URL'],
            };
            const outputText = (o) => [o && o.title, o && o.summary, o && o.text].filter(Boolean).join('\n');
            const parse = (text) => {
              const grab = (labels) => {
                for (const label of labels) {
                  const m = (text || '').match(new RegExp(`${label}[^\\n]*?(https?://[^\\s)\\]<>"']+)`, 'i'));
                  if (m) return m[1];
                }
                return null;
              };
              return { alias: grab(LABELS.alias), preview: grab(LABELS.preview) };
            };

            let urls = parse(outputText(cr.output));
            const succeeded = action === 'completed' && cr.conclusion === 'success';
            if (succeeded && !urls.alias && !urls.preview) {
              try {
                const { data } = await github.rest.checks.get({ owner, repo, check_run_id: cr.id });
                urls = parse(outputText(data.output));
              } catch (e) {
                core.warning(`Could not re-fetch check run output: ${e.message}`);
              }
            }
            if (succeeded && !urls.alias && !urls.preview) {
              core.warning(
                'Build succeeded but no preview URL was found in the check-run output. ' +
                'Preview URLs are opt-in per Worker, so check that they are enabled — and ' +
                'if they are, the labels in the summary have probably changed again.'
              );
            }

            // Compose the comment body for this event.
            let body;
            if (action === 'created') {
              body =
                `🏗️ **Cloudflare build started** for ${commitLink}\n\n` +
                `[View build on Cloudflare ↗](${buildUrl})`;
            } else {
              const conclusion = cr.conclusion;
              if (conclusion === 'success') {
                const lines = [`✅ **Cloudflare build succeeded** for ${commitLink}`, ''];
                if (urls.alias) lines.push(`**Pull Request/Branch Preview URL:** ${urls.alias}`);
                // A summary carrying only the branch alias matches both label sets.
                if (urls.preview && urls.preview !== urls.alias) {
                  lines.push(`Commit Preview URL: ${urls.preview}`);
                }
                lines.push('', `[Build details ↗](${buildUrl})`);
                body = lines.join('\n');
              } else if (conclusion === 'skipped' || conclusion === 'neutral') {
                body =
                  `⏭️ **Cloudflare build skipped** for ${commitLink}\n\n` +
                  `[View build ↗](${buildUrl})`;
              } else {
                // failure, timed_out, cancelled, action_required, stale
                const label = String(conclusion || 'failed').replace(/_/g, ' ');
                body =
                  `❌ **Cloudflare build ${label}** for ${commitLink}\n\n` +
                  `[View build logs ↗](${buildUrl})`;
              }
            }

            // One unlucky PR must not swallow the comment owed to the others.
            let failures = 0;
            for (const issue_number of prNumbers) {
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`Commented on PR #${issue_number} (${action}/${cr.conclusion || cr.status}).`);
              } catch (e) {
                failures++;
                core.error(`Failed to comment on PR #${issue_number}: ${e.message}`);
              }
            }
            if (failures > 0 && failures === prNumbers.length) {
              core.setFailed('Could not comment on any PR.');
            }
