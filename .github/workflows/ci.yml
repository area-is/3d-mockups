name: CI

# Runs on every PR and every push to main. Deploys are handled by Cloudflare
# Workers Builds (configured in the dashboard, not here) and releases by
# release.yml on a tag. This workflow only checks.

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` runs the `prepare` hooks, which build packages/react/dist.
      # The device check and the docs build both read it.
      - name: Install and build the package
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Guards the half of the device table the library can derive, plus the
      # modelled-aspect check against the hand-maintained panel grid.
      - name: Device table
        run: npm run devices:check

      # The generated files are committed so typecheck works on a clean
      # checkout; this catches a docs edit that was never re-extracted.
      - name: Generated docs files are up to date
        working-directory: apps/docs
        run: |
          node scripts/extract-demo-sources.mjs
          node scripts/extract-prop-tables.mjs
          git diff --exit-code -- lib/ \
            || (echo "::error::lib/*.generated.ts is stale. Run the extract scripts and commit the result." && exit 1)

      - name: Build the docs site
        run: npm run build:docs
